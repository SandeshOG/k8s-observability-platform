apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-platform
  labels:
    app: observability-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: observability-platform
  template:
    metadata:
      labels:
        app: observability-platform
    spec:
      containers:
      - name: app
        image: k8s-observability-platform:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        envFrom:
        - configMapRef:
            name: platform-config